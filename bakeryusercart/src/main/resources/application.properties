spring.application.name=bakeryusercart

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/mydb
spring.datasource.username=bakery_user
spring.datasource.password=t3702009
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# MyBatis 會掃描您指定的包以及其子包下的所有 Java 類別
mybatis.type-aliases-package=demo.usercart.model

# 駝峰命名自動對應功能開啟 (ex: user_name -> userName)
mybatis.configuration.map-underscore-to-camel-case=true

# 指定 Mapper XML 檔案位置
mybatis.mapper-locations=classpath:mapper/*.xml

# 設定自動對應的行為等級
mybatis.configuration.auto-mapping-behavior=FULL

# 僅限本機 HTTP 開發；正式 HTTPS 環境改為 true
app.auth.cookie-secure=false

# 啟用 multipart 檔案上傳
spring.servlet.multipart.enabled=true

# 單一檔案最多 5 MB
spring.servlet.multipart.max-file-size=5MB

# 整個請求最多 30 MB
# 5 張圖片最多 25 MB，另外預留 JSON 與 multipart 格式空間
spring.servlet.multipart.max-request-size=30MB

# 上傳內容超過此大小時使用暫存檔，避免全部放在記憶體
spring.servlet.multipart.file-size-threshold=0B

# 商品圖片轉存來源資料夾
app.product-image.import-directory=C:/frontEnd/bakeryweb/bakeryweb/public/images

# 暫時開啟，這次啟動執行商品圖片轉存
app.product-image.import-enabled=false